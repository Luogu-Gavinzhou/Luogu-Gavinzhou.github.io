<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C++ 学习手记</title><meta name="description" content="记录 C++ 学习、算法与项目实践的个人博客"><style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#151e30;--text:#e9eef7;--muted:#a4b3c8;--accent:#55d6b3;--border:#2a3850}body.light{color-scheme:light;--bg:#f7fafc;--panel:#fff;--text:#172338;--muted:#53647b;--accent:#087f69;--border:#dce4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1040px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--border)}nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0}nav strong{font-size:19px}nav a{margin-left:16px;color:var(--muted)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);padding:7px 12px}.hero{padding:72px 0 44px}.tag{color:var(--accent);font-weight:700;letter-spacing:.08em}.hero h1{font-size:clamp(32px,6vw,54px);line-height:1.2;margin:16px 0}.hero p{color:var(--muted);max-width:680px}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:5px 12px;color:var(--muted);margin:8px 8px 0 0}.section-title{margin-top:32px}#search{width:100%;padding:13px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--text);margin:8px 0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{border:1px solid var(--border);background:var(--panel);border-radius:16px;padding:22px;transition:transform .2s}.card:hover{transform:translateY(-3px)}.card small{color:var(--accent)}.card h3{margin:10px 0}.card p,footer{color:var(--muted)}article{max-width:780px;margin:35px auto;padding:28px;background:var(--panel);border:1px solid var(--border);border-radius:16px}pre{overflow:auto;background:#080e19;color:#d9f6ec;padding:18px;border-radius:10px}code{font-family:ui-monospace,Consolas,monospace}footer{text-align:center;padding:60px 0 30px}#post{display:none}.back{color:var(--accent);cursor:pointer} @media(max-width:550px){nav{flex-wrap:wrap}.hero{padding-top:48px}article{padding:18px}}
</style></head><body><header><div class="wrap"><nav><strong>⌘ C++ 学习手记</strong><div><a href="#home" onclick="showHome()">首页</a><a href="#posts" onclick="showHome()">文章</a><button id="theme" aria-label="切换主题">☀ / ☾</button></div></nav></div></header><main class="wrap"><div id="home"><section class="hero"><div class="tag">HELLO, WORLD!</div><h1>你好，我是一名<br><span style="color:var(--accent)">正在成长的 C++ 学习者。</span></h1><p>在这里记录 C++ 基础、数据结构、算法与项目实践。用文字整理思路，用代码验证想法。</p><span class="pill">C++</span><span class="pill">数据结构</span><span class="pill">算法</span><span class="pill">学习日志</span></section><h2 class="section-title" id="posts">最新文章</h2><input id="search" type="search" placeholder="搜索文章标题或分类…" aria-label="搜索文章"><div class="cards" id="cards"></div></div><article id="post"><a class="back" href="#posts" onclick="showHome()">← 返回文章列表</a><div id="postContent"></div></article></main><footer>© <span id="year"></span> C++ 学习手记 · 保持好奇，持续编码</footer><script>
// 在这里添加你的文章。body 支持 HTML，可插入 <pre><code>...</code></pre> 代码块。
const posts=[{title:'我的第一篇 C++ 学习笔记',category:'C++ 基础',date:'2026-10-28',summary:'从 Hello World 开始，认识 C++ 程序的基本结构。',body:`<h1>我的第一篇 C++ 学习笔记</h1><p>今天开始系统学习 C++，先写下经典的 Hello World。</p><pre><code>#include &lt;iostream&gt;\n\nint main() {\n    std::cout &lt;&lt; "Hello, World!" &lt;&lt; std::endl;\n    return 0;\n}</code></pre><h2>学到了什么？</h2><p><code>#include &lt;iostream&gt;</code> 引入标准输入输出库；<code>main()</code> 是程序入口；<code>std::cout</code> 用来输出内容。</p>`},{title:'C++ 中的变量与数据类型',category:'C++ 基础',date:'2026-10-27',summary:'认识 int、double、char、bool 和基本变量声明。',body:`<h1>C++ 中的变量与数据类型</h1><p>变量用于保存程序运行过程中需要的数据。</p><pre><code>int age = 18;\ndouble pi = 3.14159;\nchar grade = 'A';\nbool isLearning = true;</code></pre><p>不同类型有不同用途，选择合适的类型是写好 C++ 的第一步。</p>`},{title:'算法练习：两数之和',category:'算法',date:'2026-10-26',summary:'用双层循环理解最基础的枚举解法。',body:`<h1>算法练习：两数之和</h1><p>给定一个整数数组和目标值，寻找两个数使其和等于目标值。</p><pre><code>#include &lt;vector&gt;\nusing namespace std;\n\nvector&lt;int&gt; twoSum(vector&lt;int&gt;&amp; nums, int target) {\n    for (int i = 0; i &lt; (int)nums.size(); ++i) {\n        for (int j = i + 1; j &lt; (int)nums.size(); ++j) {\n            if (nums[i] + nums[j] == target) return {i, j};\n        }\n    }\n    return {};\n}</code></pre><p>时间复杂度为 O(n²)，后续可以尝试使用哈希表优化。</p>`}];
const cards=document.getElementById('cards');function render(q=''){const items=posts.filter(p=>(p.title+p.category+p.summary).toLowerCase().includes(q.toLowerCase()));cards.innerHTML=items.map((p)=>`<a class="card" href="#post-${posts.indexOf(p)}" data-post="${posts.indexOf(p)}"><small>${p.category} · ${p.date}</small><h3>${p.title}</h3><p>${p.summary}</p><span style="color:var(--accent)">阅读全文 →</span></a>`).join('')||'<p>没有找到相关文章。</p>';cards.querySelectorAll('[data-post]').forEach(a=>a.addEventListener('click',()=>openPost(Number(a.dataset.post))))}function openPost(i){document.getElementById('home').style.display='none';document.getElementById('post').style.display='block';document.getElementById('postContent').innerHTML=posts[i].body;window.scrollTo(0,0)}function showHome(){document.getElementById('home').style.display='block';document.getElementById('post').style.display='none'}document.getElementById('search').addEventListener('input',e=>render(e.target.value));document.getElementById('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('blogTheme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('blogTheme')==='light')document.body.classList.add('light');document.getElementById('year').textContent=new Date().getFullYear();render();if(location.hash.startsWith('#post-')){const i=Number(location.hash.slice(6));if(posts[i])openPost(i)}
</script></body></html>
