const posts=[{id:'cpp-pointer',title:'C++ 学习笔记：指针与引用的区别',date:'2026-10-28',category:'cpp',label:'C++ 基础',tags:['指针','引用'],excerpt:'整理指针与引用的核心区别、常见用法，以及初学者容易踩到的坑。',body:`<p>指针和引用都是 C++ 中非常重要的概念。理解它们的区别，有助于更好地管理对象与内存。</p><h2>1. 指针是什么？</h2><p>指针是保存地址的变量，可以通过 <code>*</code> 解引用访问所指向的对象。</p><pre><code>#include &lt;iostream&gt;
int main() {
    int x = 10;
    int* p = &amp;x;
    std::cout &lt;&lt; *p &lt;&lt; '\n';
}</code></pre><h2>2. 引用是什么？</h2><p>引用可以理解为已有对象的别名。普通左值引用声明时必须初始化。</p><pre><code>int x = 10;
int&amp; ref = x;
ref = 20; // x 也变成 20</code></pre><h2>3. 核心区别</h2><ul><li>指针可以为空；引用必须绑定到有效对象（不要创建悬空引用）。</li><li>指针可以改为指向其他对象；引用不能重新绑定。</li><li>使用指针通常需要解引用；引用的使用语法与原对象类似。</li></ul>`},{id:'cpp-vector',title:'STL 入门：vector 的常见操作',date:'2026-10-26',category:'cpp',label:'C++ 基础',tags:['STL','vector'],excerpt:'通过简短代码掌握 vector 的创建、追加、遍历以及常用成员函数。',body:`<p><code>std::vector</code> 是 C++ 标准库提供的动态数组容器，适合存储一组同类型元素。</p><h2>基本操作</h2><pre><code>#include &lt;iostream&gt;
#include &lt;vector&gt;
int main() {
    std::vector&lt;int&gt; nums{1, 2, 3};
    nums.push_back(4);
    for (int x : nums) std::cout &lt;&lt; x &lt;&lt; ' ';
}</code></pre><p>常用方法包括 <code>size()</code>、<code>empty()</code>、<code>push_back()</code> 和 <code>pop_back()</code>。</p>`},{id:'binary-search',title:'算法笔记：二分查找的实现与边界',date:'2026-10-24',category:'algorithm',label:'数据结构与算法',tags:['算法','二分查找'],excerpt:'在有序数组中高效查找目标值，理解循环条件与左右边界的处理方式。',body:`<p>二分查找适用于有序区间，每次将搜索范围缩小一半，时间复杂度为 <code>O(log n)</code>。</p><h2>示例代码</h2><pre><code>#include &lt;vector&gt;
int binarySearch(const std::vector&lt;int&gt;&amp; a, int target) {
    int left = 0, right = static_cast&lt;int&gt;(a.size()) - 1;
    while (left &lt;= right) {
        int mid = left + (right - left) / 2;
        if (a[mid] == target) return mid;
        if (a[mid] &lt; target) left = mid + 1;
        else right = mid - 1;
    }
    return -1;
}</code></pre><p>注意：数组必须有序；计算中点时使用 <code>left + (right - left) / 2</code> 可以避免直接相加的潜在溢出问题。</p>`}];

tion.hash.startsWith('#/post/')||location.hash==='#/about')location.hash='#/';else render()});render();
